<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ECM 週期預測模型</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&family=JetBrains+Mono:wght@300;400;500;600;700;800&family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <script type="module" src="/index.tsx"></script>
  <style>
    body {
      font-family: 'Inter', 'Noto Sans TC', sans-serif;
      background-color: #0f172a; /* Slate 900 */
      color: #f1f5f9;
      letter-spacing: -0.01em;
    }
    
    .font-mono {
      font-family: 'JetBrains Mono', monospace !important;
    }

    .terminal-text {
      font-family: 'JetBrains Mono', monospace !important;
      letter-spacing: -0.05em;
      font-variant-numeric: tabular-nums;
    }

    @keyframes price-glow {
      0%, 100% { text-shadow: 0 0 10px rgba(251, 191, 36, 0.2); }
      50% { text-shadow: 0 0 30px rgba(251, 191, 36, 0.5), 0 0 10px rgba(251, 191, 36, 0.2); }
    }
    .animate-price-glow {
      animation: price-glow 4s ease-in-out infinite;
    }

    .scrollbar-hide::-webkit-scrollbar {
        display: none;
    }
    .scrollbar-hide {
        -ms-overflow-style: none;
        scrollbar-width: none;
    }
    /* Custom Scrollbar for Content Areas */
    .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
        background: rgba(15, 23, 42, 0.3);
        border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
        background-color: #334155;
        border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background-color: #475569;
    }
    
    /* Custom Animations */
    @keyframes pulse-gold {
      0%, 100% { box-shadow: 0 0 5px rgba(251, 191, 36, 0.3); }
      50% { box-shadow: 0 0 20px rgba(251, 191, 36, 0.6); }
    }
    .animate-pulse-gold {
      animation: pulse-gold 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    @keyframes pulse-green {
      0%, 100% { opacity: 1; transform: scale(1); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      50% { opacity: 0.7; transform: scale(1.1); box-shadow: 0 0 10px 4px rgba(16, 185, 129, 0); }
    }
    .animate-pulse-green {
      animation: pulse-green 2s infinite;
    }

    @keyframes expand-ring {
      0% { transform: scale(1); opacity: 0.8; }
      100% { transform: scale(3); opacity: 0; }
    }
    .animate-expand-ring {
      animation: expand-ring 2s infinite;
    }

    /* Professional terminal blur effect */
    .terminal-blur {
      backdrop-filter: blur(12px) saturate(180%);
      background-color: rgba(15, 23, 42, 0.75);
    }
    
    /* For PDF capture */
    .pdf-content {
      background-color: #0f172a !important;
    }

    /* Glow effect for charts */
    .chart-glow {
      filter: drop-shadow(0 0 12px rgba(251, 191, 36, 0.3));
    }
    .chart-glow-green {
      filter: drop-shadow(0 0 12px rgba(16, 185, 129, 0.3));
    }
  </style>
<script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "jspdf": "https://esm.sh/jspdf@^2.5.1",
    "html2canvas": "https://esm.sh/html2canvas@^1.4.1"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body>
  <div id="root"></div>
</body>
</html>
